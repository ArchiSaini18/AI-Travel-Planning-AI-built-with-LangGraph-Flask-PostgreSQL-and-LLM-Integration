<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Travel Planner AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Travel Planner">
                </div>
                <h1>Reset Password</h1>
                <p>Enter your email to receive a reset link</p>
            </div>

            <div id="message"></div>

            <form id="forgot-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </form>

            <div class="auth-footer">
                <p><a href="/login">Back to login</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = `
                        <div class="success-message">
                            If an account exists with this email, you'll receive a reset link.
                        </div>
                    `;
                    document.getElementById('forgot-form').reset();
                } else {
                    messageDiv.innerHTML = `<div class="error-message">${data.error || 'An error occurred'}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="error-message">An error occurred. Please try again.</div>`;
            }
        });
    </script>
</body>
</html>
